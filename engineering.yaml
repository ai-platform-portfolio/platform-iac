version: 1
terraform:
  roots: [terraform/modules, terraform/ci]
  profile: module
  approved_repositories: [ai-platform-portfolio/terraform-modules]
  collections:
    - files: terraform/modules/network/*
      type: azurerm_subnet
      expression: var.subnets
    - files: terraform/modules/network/*
      type: azurerm_private_dns_zone
      expression: var.private_dns_zones
    - files: terraform/modules/network/*
      type: azurerm_private_dns_zone_virtual_network_link
      expression: var.private_dns_zones
    - files: terraform/modules/identity/*
      type: azurerm_user_assigned_identity
      expression: var.workloads
    - files: terraform/modules/storage/*
      type: azurerm_storage_container
      expression: var.containers
    - files: terraform/modules/storage/*
      type: azurerm_role_assignment
      expression: var.role_assignments
comments:
  max_lines: 5
  max_characters: 400
duplication:
  min_tokens: 50
  min_lines: 5
exclude: [terraform/examples/*, terraform/scripts/*]
protected_paths: [engineering.yaml, '.github/*']
exceptions:
  - rule: TF002
    file: terraform/ci/functions.tf
    symbol: functions
    reason: Central deployment composes the reviewed function-app module from this revision.
    owner: michaelalinks
  - rule: TF002
    file: terraform/ci/main.tf
    symbol: network
    reason: Central deployment composes the network module from the same reviewed repository revision.
    owner: michaelalinks
  - rule: TF002
    file: terraform/ci/main.tf
    symbol: deployment_identity
    reason: Central deployment composes the identity module from the same reviewed repository revision.
    owner: michaelalinks
